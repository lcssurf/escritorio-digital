<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: PS; src: url(../../site/fonts/PressStart2P.ttf); }
html, body { margin: 0; background: transparent; }
.sign { display: inline-flex; align-items: center; gap: 14px; margin: 10px 14px 16px 6px; padding: 10px 20px 12px 14px;
  background: #4a3b2c; border: 4px solid #2f251b; border-radius: 8px; box-shadow: 0 0 0 3px #9c7f5c, 0 6px 0 3px rgba(18,22,12,.35); }
.sign img { width: 28px; height: 32px; image-rendering: pixelated; }
.sign span { font: 20px/1 PS; letter-spacing: 1px; color: #fff; text-shadow: 2px 2px 0 #b45a3c, 4px 4px 0 #1e150c; padding-bottom: 4px; }
.sign span b { font-weight: 400; color: #ffd59e; }
</style></head><body><div class="sign"><img src="../../site/logo.svg" alt=""><span id="t"></span></div>
<script>const [t, ico] = decodeURIComponent(location.hash.slice(1)).split("|"); const w = t.split(" ");
if (ico) { const i = document.querySelector(".sign img"); i.src = ico; i.style.width = i.style.height = "32px"; } document.getElementById("t").innerHTML = w.slice(0, -1).join(" ") + (w.length > 1 ? " " : "") + "<b>" + w.at(-1) + "</b>";</script></body></html>
