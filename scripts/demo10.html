<!doctype html>
<!-- 10-second clodfarm teaser: 5 steps, one big line each, on the farm UI's own HD sprites and layout.
     Deterministic: window.render(t). Render: node scripts/render-demo.mjs -->
<html lang="en"><head><meta charset="utf-8"><title>clodfarm in 10 seconds</title>
<link rel="stylesheet" href="../clodfarm/ui/style.css">
<style>
  html, body { overflow: hidden; height: auto; }
  body { margin: 0; width: 1920px; height: 1080px; background: #1c3519; position: relative; -webkit-font-smoothing: antialiased; }

  .tagname.mine { color: #ffd59e; }

  #dockw .dock { position: static; }
  #dockw .tool.hot { background: #fff6e2; outline: 4px solid #ffd24a; outline-offset: 2px; }
  /* the one big line */
  #cap { left: 1150px; top: 40px; transform: translateX(-50%); padding: 26px 40px 30px; text-align: center; white-space: nowrap; }
  #cap .n { display: inline-block; font: 34px/1 var(--font-px); color: #fff; background: var(--clay); border: 4px solid var(--ink); border-radius: 8px; padding: 12px 16px; margin-right: 22px; vertical-align: middle; }
  #cap .t { display: inline-block; font: 42px/1.1 var(--font-px); color: var(--ink); vertical-align: middle; }
  #cap .b { font: 44px/1 var(--font-body); color: var(--ink-2); margin-top: 16px; }
  /* phone */
  #phone { left: 70px; top: 330px; width: 500px; height: 660px; background: #1c2233; border: 7px solid #0e121c; border-radius: 52px;
    box-shadow: 0 12px 0 rgba(18,22,12,.35), 0 30px 60px rgba(0,0,0,.35); padding: 50px 18px 24px; }
  #phone .scr { background: var(--paper); border-radius: 22px; height: 100%; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; }
  #phone .app { font: 15px/1.5 var(--font-px); color: var(--clay-2); border-bottom: 3px solid var(--paper-2); padding-bottom: 14px; }
  .msg { font: 46px/1 var(--font-body); padding: 14px 18px; border: 4px solid var(--ink); border-radius: 14px; background: #fff; max-width: 90%; }
  .msg.me { align-self: flex-end; background: #fde6df; }

  #meter { left: 50%; bottom: 190px; width: 1000px; margin-left: -500px; padding: 24px 34px 30px; }
  #meter .h { font: 24px var(--font-px); display: flex; justify-content: space-between; margin-bottom: 20px; }
  #meter .h em { font-style: normal; color: #c0392b; }
  #meter .bar { position: relative; height: 50px; background: #3b3f4a; border: 5px solid var(--ink); border-radius: 14px; }
  #meter .bar i { display: block; height: 100%; border-radius: 8px; background: var(--hp-good); box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); }
  #meter .bar i.mid { background: var(--hp-mid); } #meter .bar i.low { background: var(--hp-low); }
  #meter .cap { position: absolute; left: 80%; top: -16px; bottom: -16px; width: 8px; margin-left: -4px; background: var(--ink); }
  #meter .cap span { position: absolute; top: 72px; left: 50%; transform: translateX(-50%); font: 18px var(--font-px); white-space: nowrap; }
  #meter .pct { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); font: 24px var(--font-px); color: #fff; text-shadow: 2px 2px 0 #1b2410; }

  #merged { left: 50%; bottom: 200px; transform: translateX(-50%); font: 42px var(--font-px); color: #fff; background: #2f9e6b; border: 5px solid var(--ink); border-radius: 12px; padding: 24px 38px; box-shadow: 0 8px 0 rgba(0,0,0,.3); white-space: nowrap; }

  .card canvas { width: 160px; height: 180px; image-rendering: pixelated; margin-bottom: 30px; }
  .card h1 { font: 124px/1 var(--font-px); margin: 0 0 36px; letter-spacing: 6px; color: #fff; text-shadow: 0 10px 0 var(--clay-2), 0 18px 0 rgba(0,0,0,.35); }
  .card .tl { font: 68px/1.05 var(--font-body); color: #f4f1e8; }
  .card .gh { margin-top: 44px; font: 34px var(--font-px); background: var(--clay); color: #fff; border: 5px solid var(--ink); border-radius: 10px; padding: 24px 32px; box-shadow: 0 7px 0 rgba(0,0,0,.35); }
  .card .fine { position: absolute; bottom: 30px; font: 26px var(--font-body); color: rgba(244,241,232,.55); }
</style></head>
<body data-page="diagram">
<div id="cam"><canvas id="bg"></canvas><canvas id="act"></canvas><canvas id="fgc"></canvas><div id="labels"></div></div>
<div id="ui"></div>
<script src="../clodfarm/ui/app.js"></script>
<script>
"use strict";
const S = 4, DUR = 10;
const $id = (i) => document.getElementById(i);
// the real farm's layout (layoutFarm), fitted to a 1920 x 1080 frame at 4 px per world pixel: barn, yard and pond on the
// left, the fenced field with its gate, sign and scarecrow on the right, dirt paths between them
const L = layoutFarm({ plots: 6, yard: 5 }, { w: 1920, h: 1080, S, top: 0, bottom: 0, left: 0, right: 0, snap: (z) => z });
const W = L.W, H = L.H, world = buildWorld(L, 7);
const bgc = $id("bg"), act = $id("act"), fgc = $id("fgc");
bgc.width = W * HD; bgc.height = H * HD; bgc.getContext("2d").drawImage(world.bg, 0, 0);
fgc.width = world.fg.width; fgc.height = world.fg.height; fgc.getContext("2d").drawImage(world.fg, 0, 0);
fgc.style.top = world.fgY * S + "px"; fgc.style.height = (H - world.fgY) * S + "px";
act.width = 1920; act.height = 1080;
const A = act.getContext("2d");

const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const back = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const win = (t, a, b, f = .25) => Math.min(seg(t, a, a + f), 1 - seg(t, b - f, b));
const el = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.append(e); return e; };
const hx = (v) => Math.round(v * HD) / HD; // on the HD grid, like the farm
const blinkAt = (t, s) => ((t * 1000 + s * 977) % 3100) < 130;

// ------------------------------------------------------------------ the cast
const COL = { matan: HAT_COLORS[1], gil: HAT_COLORS[2], noa: HAT_COLORS[4], ido: HAT_COLORS[7], dana: HAT_COLORS[6], roni: HAT_COLORS[3], omer: HAT_COLORS[0] };
const SKIN = {
  matan: skinOf("straw", null, "", COL.matan), gil: skinOf("beanie", null, "", COL.gil), noa: skinOf("cap", null, "", COL.noa),
  ido: skinOf("headphones", null, "", COL.ido), dana: skinOf("bow", null, "scarf", COL.dana), roni: skinOf("flower", null, "", COL.roni), omer: skinOf("sprout", null, "glasses", COL.omer),
};
const P = L.plots, spotOf = (p) => ({ x: p.x - 7, y: p.y + p.h }), subAt = (p, n) => ({ x: p.x + SUB_SPOTS[n][0], y: p.y + SUB_SPOTS[n][1] });
const M = spotOf(P[0]), G2 = spotOf(P[1]), N = spotOf(P[2]), I = spotOf(P[3]);
const NAP = yardSpot(L, 4), DANA = yardSpot(L, 1), gateIn = { x: L.field.x + 10, y: L.gate.at };
const SLEEP = 7.0, NAP_WALK = 7.15;
/** A walk along a polyline at `speed` world px/s from t0: where it is, which way it faces, its step. */
function walk(pts, t0, speed, t) {
  let d = Math.max(0, (t - t0) * speed);
  const total = pts.reduce((s, p, i) => i ? s + Math.hypot(p.x - pts[i - 1].x, p.y - pts[i - 1].y) : 0, 0), moving = d > 0 && d < total;
  d = Math.min(d, total);
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], l = Math.hypot(b.x - a.x, b.y - a.y);
    if (d <= l || i === pts.length - 1) { const u = l ? Math.min(1, d / l) : 1, step = Math.floor(d / (speed * 0.11)) % 4;
      return { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), moving, dir: Math.sign(b.x - a.x) || 0, legs: moving ? [1, 0, 2, 0][step] : 0, bob: moving && step % 2 ? -0.5 : 0 }; }
    d -= l;
  }
}
/** A back-and-forth stroll (the farm's Claudes walk round when idle), with pauses at each end. */
function stroll(a, b, speed, t, pause = 1.1, t0 = 0) {
  const l = Math.hypot(b.x - a.x, b.y - a.y), leg = l / speed, cyc = 2 * (leg + pause), u = ((t - t0) % cyc + cyc) % cyc;
  if (u < leg) return walk([a, b], 0, speed, u);
  if (u < leg + pause) return { ...walk([a, b], 0, speed, leg + 1), look: u < leg + pause / 2 ? 0 : -1 };
  if (u < 2 * leg + pause) return walk([b, a], 0, speed, u - leg - pause);
  return { ...walk([b, a], 0, speed, leg + 1), look: 0 };
}
// sub-agents: matan's three (one git branch each), then the one gil's Claude runs for matan on gil's account
const minis = [
  { col: COL.matan, ...subAt(P[0], 0), born: 3.1, done: 8.1, br: "export", up: true },
  { col: COL.matan, ...subAt(P[0], 1), born: 3.4, done: 8.25, br: "api", up: true },
  { col: COL.matan, ...subAt(P[0], 3), born: 3.7, done: 8.4, br: "docs" },
  { col: COL.gil, ...subAt(P[0], 2), born: 5.75, done: 8.55 },
  { col: COL.gil, ...subAt(P[1], 0), born: -1, done: 99 },
  { col: COL.ido, ...subAt(P[3], 0), born: -1, done: 99 },
  { col: COL.ido, ...subAt(P[3], 3), born: -1, done: 99 },
];
const scroll = paint(ICONS.scroll[0], ICONS.scroll[1], 10);

// ---------------------------------------------------------------- world labels
const LB = $id("labels"), atW = (e, x, y) => { e.style.left = Math.round(x * S) + "px"; e.style.top = Math.round(y * S) + "px"; return e; };
const tags = {};
for (const n of ["matan", "gil", "noa", "ido", "roni", "omer"]) tags[n] = el("div", "tagname" + (n === "matan" ? " mine" : ""), LB, n);
const btags = minis.slice(0, 3).map(m => atW(el("div", "btag" + (m.up ? " up" : ""), LB, "⎇ " + m.br), m.x, m.up ? m.y - 9.5 : m.y + 1.5));
const zzz = atW(el("div", "bubble", LB, `<img src="${icon("zzz")}" alt=""><span>RESTING</span>`), NAP.x, NAP.y - 24);
const onit = atW(el("div", "bubble ok", LB, `<img src="${icon("heart")}" alt=""><span>ON IT</span>`), G2.x, G2.y - 25);
const ask = atW(el("div", "bubble", LB, `<img src="${icon("scroll")}" alt=""><span>GIL, TAKE THE TESTS?</span>`), M.x, M.y - 25);
const gtag = atW(el("div", "bubble ok", LB, "<span>ON GIL'S ACCOUNT</span>"), minis[3].x, minis[3].y - 12);
const subs = atW(el("div", "bubble", LB, `<img src="${icon("terminal")}" alt=""><span></span>`), M.x, M.y - 25);
const gbub = atW(el("div", "bubble", LB, `<img src="${icon("terminal")}" alt="">`), G2.x, G2.y - 25);
const crowb = atW(el("div", "bubble crow", LB, `<img src="${icon("plan")}" alt=""><span>PLANNING</span>`), L.crow.x, L.crow.y - 24);

// ------------------------------------------------------------------ screen UI
const UIr = $id("ui");
// the farm's HUD: the tokens counter and your Claude's card
const hud = el("div", "ui", UIr, `<div class="tokens"><span class="tok-big"><span class="fire">🔥</span> <b id="tt">0</b> TOKENS</span><span class="tok-today" id="td"></span></div>
  <div class="mine-block"><span class="mine-h"><img src="${UI.spriteURL(SKIN.matan)}" alt=""><span>YOUR CLAUDE <b>MATAN</b></span></span>
  <span class="mine-t"><b id="mt">0</b> tokens today · <b>42M</b> total</span></div>`); hud.id = "hudw";
const mb = hud.querySelector(".mine-block"), hp5 = UI.hp("5H", .33, null, true), hp7 = UI.hp("7D", .22, null, true); mb.append(hp5, hp7);
const setHp = (e, u) => { const i = e.querySelector(".bar i"); i.style.width = Math.round(u * 100) + "%"; i.className = u < .5 ? "" : u < .8 ? "mid" : "low"; e.querySelector(".lbl").textContent = Math.round(u * 100) + "%"; };
// the dock, as the farm shows it: YOUR CLAUDE / THE FARM / MANAGE, then + NEW CLAUDE
const tool = (ic, lbl, id = "") => `<span class="tool"${id ? ` id="${id}"` : ""}>${ic === "slack" ? `<img alt="" src="../clodfarm/ui/slack.svg">` : `<img alt="" src="${icon(ic)}">`}<span class="lbl">${lbl}</span></span>`;
const dock = el("div", "ui", UIr, `<nav class="dock"><span class="tool help-tool"><span class="q">?</span><span class="lbl">HELP</span></span>
  <div class="dock-group" data-cap="YOUR CLAUDE">${tool("chat", "TALK", "d-talk")}${tool("globe", "BROWSER")}</div>
  <div class="dock-group" data-cap="THE FARM">${tool("roster", "EVERYONE")}${tool("tasks", "TASKS", "d-tasks")}${tool("chart", "STATS")}</div>
  <div class="dock-group" data-cap="MANAGE">${tool("slack", "SLACK")}${tool("gear", "MANAGE")}</div>
  <span class="tool hatch-tool"><img alt="" src="${icon("egg")}"><span class="lbl"><span class="plus">+ </span>NEW<span class="long"> CLAUDE</span></span></span></nav>`); dock.id = "dockw";
const cap = el("div", "ui panel", UIr, `<div><span class="n"></span><span class="t"></span></div><div class="b"></div>`); cap.id = "cap";
const STEPS = [
  [1.0, 2.9, "1", "ASK YOUR CLAUDE", "from the Claude app on your phone"],
  [2.9, 4.5, "2", "IT SPLITS THE WORK", "sub-agents, each on its own git branch"],
  [4.5, 6.3, "3", "CLAUDES TEAM UP", "your Claude asks a teammate's Claude for help"],
  [6.3, 8.0, "4", "IT STAYS IN BUDGET", "each Claude pauses at 80% of its weekly limit"],
  [8.0, 9.15, "5", "IT SHIPS TESTED CODE", "merges to main only when tests pass"],
];
const phone = el("div", "ui", UIr, `<div class="scr"><div class="app">CLAUDE APP → CODE → [CLODFARM] MATAN</div><div class="msg me"></div><div class="msg">On it.</div></div>`); phone.id = "phone";
const [meMsg, aiMsg] = phone.querySelectorAll(".msg");
const meter = el("div", "ui panel", UIr, `<div class="h"><span>NOA · WEEKLY USAGE</span><em></em></div><div class="bar"><i></i><b class="cap"><span>STOP 80%</span></b><span class="pct"></span></div>`); meter.id = "meter";
const merged = el("div", "ui", UIr, "TESTS PASSED → MERGED TO MAIN"); merged.id = "merged";
const veil = el("div", "", UIr); veil.id = "veil";
const title = el("div", "card", UIr, `<canvas width="32" height="36"></canvas><h1>CLODFARM</h1><div class="tl">Claude Code agents that work 24/7.</div>`);
const end = el("div", "card", UIr, `<canvas width="32" height="36"></canvas><h1>CLODFARM</h1><div class="tl">Free and open source.</div>
  <div class="gh">★ github.com/matank001/clodfarm</div><div class="fine">MIT · independent project, not affiliated with Anthropic</div>`);
const cardCv = [title, end].map(c => { const x = c.querySelector("canvas").getContext("2d"); x.imageSmoothingEnabled = false; return x; });

// ------------------------------------------------------------------- camera
const midMG = { x: (M.x + G2.x) / 2 + 4, y: M.y - 6 };
const K = [[0, W / 2, H / 2, 1], [0.8, W / 2, H / 2, 1], [3.4, M.x + 40, M.y - 4, 1.5], [4.5, M.x + 40, M.y - 4, 1.5], [4.95, midMG.x, midMG.y, 2.0], [6.2, midMG.x, midMG.y, 2.0],
  [6.75, (N.x + NAP.x) / 2 + 6, (N.y + NAP.y) / 2 - 8, 1.45], [7.95, (N.x + NAP.x) / 2 + 6, (N.y + NAP.y) / 2 - 8, 1.45], [8.45, M.x + 4, M.y + 15, 1.3], [99, M.x + 4, M.y + 15, 1.3]];
function camera(t) {
  let i = 1; while (i < K.length - 1 && t > K[i][0]) i++;
  const u = ease(seg(t, K[i - 1][0], K[i][0])), z = lerp(K[i - 1][3], K[i][3], u), cx = lerp(K[i - 1][1], K[i][1], u), cy = lerp(K[i - 1][2], K[i][2], u);
  const tx = clamp(960 - cx * S * z, 1920 - 1920 * z, 0), ty = clamp(540 - cy * S * z, 1080 - 1080 * z, 0);
  $id("cam").style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
}

// ------------------------------------------------------------------ drawing
const shC = shadowSprite(7, 2), shM = shadowSprite(4, 1);
function drawClaude(skin, x, y, o) {
  const X = hx(x), Y = hx(y);
  A.globalAlpha = 0.35; A.drawImage(shC, X - shC.width / 4, Y - shC.height / 4, shC.width / 2, shC.height / 2); A.globalAlpha = 1;
  A.drawImage(skinFrameHD(skin, o.pose), X - 8, Y - 17 + (o.bob || 0), 16, 18);
  if (o.laptop != null) A.drawImage(LAPTOP_HD[o.laptop], X + 4, Y - 6, 9, 7);
  if (o.zzz != null) for (let k = 0; k < 2; k++) { const ph = (o.zzz * 0.4 + k * 0.5) % 1;
    A.globalAlpha = Math.min(1, (1 - ph) * 1.6); A.drawImage(ZED, hx(X + 5 + ph * 4 + Math.sin(ph * 6 + k) * 1.5), hx(Y - 14 - ph * 11), 3, 3); A.globalAlpha = 1; }
  if (o.mine) A.drawImage(ARROW_MINE, X - 2.25, Y - 26 + (Math.floor(o.t * 2) % 2) * 0.5, 4.5, 3.5);
}
function drawMini(m, t) {
  const pop = m.born < 0 ? 1 : back(seg(t, m.born, m.born + .35)), gone = seg(t, m.done, m.done + .3);
  if (t < m.born || gone >= 1) return;
  const X = hx(m.x), Y = hx(m.y - Math.sin(gone * Math.PI) * 5), a = 1 - gone, w = 10 * pop, hh = 8 * pop;
  A.globalAlpha = 0.35 * a * pop; A.drawImage(shM, X - shM.width / 4, hx(m.y) - shM.height / 4, shM.width / 2, shM.height / 2);
  A.globalAlpha = a; A.drawImage(miniHD(m.col, { arms: Math.floor(t * 6 + m.x) % 2, blink: blinkAt(t, m.x) }), X - w / 2, Y - hh, w, hh);
  if (pop > .9 && !gone) { // its tiny laptop, as on the farm
    A.fillStyle = "#1b1f2a"; A.fillRect(X + 3, Y - 4, 4.5, 3); A.fillStyle = Math.floor(t * 3 + m.x) % 2 ? "#7cfc9a" : "#2c4a3c"; A.fillRect(X + 3.5, Y - 3.5, 3.5, 1);
    A.fillStyle = "#d97757"; A.fillRect(X + 3.5, Y - 2.5, 2, 0.5); A.fillStyle = "#9aa3b2"; A.fillRect(X + 2.5, Y - 1, 5.5, 1);
  }
  A.globalAlpha = 1;
  for (const t0 of [m.born, m.done]) { const u = seg(t, t0, t0 + .6); if (t0 < 0 || u <= 0 || u >= 1) continue; // a burst of sparkles
    for (let k = 0; k < 8; k++) { const an = k / 8 * Math.PI * 2 + t0, r = 3 + easeOut(u) * 11;
      if (u > .7 && k % 2) continue; A.drawImage(SPARKLE[k % 4], hx(m.x + Math.cos(an) * r - 1.75), hx(m.y - 5 + Math.sin(an) * r * .7 - u * 4 - 1.75), 3.5, 3.5); } }
}
const cropStage = (t) => t < 3.1 ? null : t < 3.7 ? "seed" : t < 4.7 ? "sprout" : t < 8.1 ? "grow" : "ripe";
const typingPose = (t, seed, look = 1) => ({ look, arms: Math.floor(t * 7 + seed) % 2 ? 2 : 3, blink: blinkAt(t, seed) });
const lap = (t, seed) => Math.floor(t * 3 + seed) % 2;
const tokensAt = (t) => { // the farm's counter: everyone at work, faster with every sub-agent
  let n = 48211907 + 26000 * t + 14000 * Math.max(0, Math.min(t, 9.2) - 2.6);
  for (const m of minis.slice(0, 4)) n += 41000 * clamp(t - m.born, 0, m.done - m.born);
  return Math.round(n);
};
const mineAt = (t) => { let n = 1284113 + 14000 * Math.max(0, Math.min(t, 9.2) - 2.6); for (const m of minis.slice(0, 3)) n += 41000 * clamp(t - m.born, 0, m.done - m.born); return Math.round(n); };

window.render = function (t) {
  camera(t);
  A.setTransform(1, 0, 0, 1, 0, 0); A.clearRect(0, 0, 1920, 1080);
  A.setTransform(S, 0, 0, S, 0, 0); A.imageSmoothingEnabled = false;
  // crops: matan's plot grows with its sub-agents and blooms into Claude's spark when the work lands
  const st = cropStage(t); if (st) drawCrops(A, P[0], st, t, st === "ripe");
  drawCrops(A, P[1], "grow", t, false); drawCrops(A, P[2], "grow", t, false); drawCrops(A, P[3], "sprout", t, false);
  drawCrops(A, P[4], "ripe", t, true); drawCrops(A, P[5], "ripe", t, true);
  // the planner's scarecrow, awake
  const cr = L.crow, sh2 = shadowSprite(8, 2);
  A.globalAlpha = 0.35; A.drawImage(sh2, cr.x - sh2.width / 4, cr.y - sh2.height / 4, sh2.width / 2, sh2.height / 2); A.globalAlpha = 1;
  A.drawImage(SCARECROW_HD[Math.floor(t * 1.4) % 2], cr.x - 8, cr.y - 21.5 + (Math.floor(t * 2.8) % 2 ? -0.5 : 0), 16, 22);

  // everyone, depth-sorted
  const list = [];
  // matan: hears you, walks in from the field's gate to its plot, works, cheers when the work is merged
  const mw = walk([gateIn, { x: M.x - 6, y: gateIn.y }, M], 1.45, 30, t);
  const cheer = t > 8.45;
  list.push({ y: mw.y, draw: () => drawClaude(SKIN.matan, mw.x, mw.y, { t, mine: true,
    pose: mw.moving ? { look: mw.dir, legs: mw.legs, blink: blinkAt(t, 1) } : t < 1.45 ? { look: Math.floor(t * 1.3) % 2 ? 1 : 0, blink: blinkAt(t, 1) }
      : cheer ? { arms: Math.floor(t * 5) % 2, happy: true } : typingPose(t, 0),
    bob: mw.moving ? mw.bob : cheer ? -Math.round(Math.abs(Math.sin(t * 8)) * 5) / 2 : 0, laptop: !mw.moving && t > 2.6 && !cheer ? lap(t, 0) : null }) });
  list.push({ y: G2.y, draw: () => drawClaude(SKIN.gil, G2.x, G2.y, { t, pose: typingPose(t, .5, t > 4.9 && t < 5.8 ? -1 : 1), laptop: lap(t, 1) }) });
  // noa: works until its week hits 80%, then puts the laptop away and goes to nap in the yard
  const nw = walk([N, { x: N.x - 12, y: N.y + 4 }, NAP], NAP_WALK, 62, t), asleep = t >= NAP_WALK && !nw.moving;
  list.push({ y: nw.y, draw: () => drawClaude(SKIN.noa, nw.x, nw.y, { t,
    pose: nw.moving ? { look: nw.dir, legs: nw.legs } : asleep ? { sleep: true } : t >= SLEEP ? { look: -1, blink: true } : typingPose(t, .2),
    bob: nw.moving ? nw.bob : asleep && Math.sin(t * 1.6) > .2 ? .5 : 0, laptop: t < SLEEP ? lap(t, 2) : t < NAP_WALK ? 2 : null, zzz: asleep ? t : null }) });
  list.push({ y: I.y, draw: () => drawClaude(SKIN.ido, I.x, I.y, { t, pose: typingPose(t, .8), laptop: lap(t, 3) }) });
  list.push({ y: DANA.y, draw: () => drawClaude(SKIN.dana, DANA.x, DANA.y, { t, pose: { sleep: true }, bob: Math.sin(t * 1.6 + 2) > .2 ? .5 : 0, zzz: t + 1.3 }) });
  // two Claudes out for a stroll round the meadow
  const rw = stroll({ x: L.field.x + L.field.w + 44, y: L.field.y + 24 }, { x: L.field.x + L.field.w + 48, y: L.field.y + L.field.h - 14 }, 22, t, 1.0, 1.7);
  list.push({ y: rw.y, draw: () => drawClaude(SKIN.roni, rw.x, rw.y, { t, pose: { look: rw.moving ? rw.dir : rw.look || 0, legs: rw.legs, blink: blinkAt(t, 5) }, bob: rw.bob }) });
  const ow = stroll({ x: L.field.x - 20, y: L.barn.y + 2 }, { x: L.field.x - 20, y: L.gate.at - 16 }, 16, t, 1.4, 0.6);
  list.push({ y: ow.y, draw: () => drawClaude(SKIN.omer, ow.x, ow.y, { t, pose: { look: ow.moving ? ow.dir : ow.look || 0, legs: ow.legs, blink: blinkAt(t, 6) }, bob: ow.bob }) });
  for (const m of minis) list.push({ y: m.y, draw: () => drawMini(m, t) });
  list.sort((a, b) => a.y - b.y).forEach(o => o.draw());
  // the scroll: matan asks gil's Claude for a hand
  const fu = seg(t, 5.0, 5.6);
  if (fu > 0 && fu < 1) { const e = ease(fu); A.drawImage(scroll, hx(lerp(M.x + 4, G2.x - 4, e) - 4), hx(lerp(M.y - 20, G2.y - 20, e) - Math.sin(e * Math.PI) * 9), 8, 8); }

  // labels
  atW(tags.matan, mw.x, mw.y + 3); atW(tags.gil, G2.x, G2.y + 3); atW(tags.noa, nw.x, nw.y + 3); atW(tags.ido, I.x, I.y + 3);
  atW(tags.roni, rw.x, rw.y + 3); atW(tags.omer, ow.x, ow.y + 3);
  const n = minis.slice(0, 4).filter(m => t >= m.born && t < m.done).length;
  subs.style.opacity = n && t > 4.6 && t < 8.3 ? 1 : 0; subs.querySelector("span").textContent = `${n} SUB-AGENT${n === 1 ? "" : "S"}`;
  subs.style.visibility = t > 4.8 && t < 5.75 ? "hidden" : "visible";
  btags.forEach((b, i) => { b.style.opacity = win(t, minis[i].born + .2, 4.75, .2); });
  gbub.style.opacity = t < 5.45 || t > 6.2 ? 1 : 0;
  zzz.style.opacity = seg(t, NAP_WALK + 1.05, NAP_WALK + 1.25); atW(zzz, NAP.x, NAP.y - 22);
  onit.style.opacity = win(t, 5.55, 6.15, .12); ask.style.opacity = win(t, 4.85, 5.7, .12); gtag.style.opacity = win(t, 6.1, 8.0, .15);
  crowb.style.opacity = t < 2.9 || t > 8.4 ? 1 : 0;

  // HUD: the burn counter ticks with the work
  $id("tt").textContent = fmtN(tokensAt(t)); $id("td").textContent = "today: " + fmtN(tokensAt(t) - 36540288);
  $id("mt").textContent = fmtN(mineAt(t)); setHp(hp5, lerp(.33, .41, seg(t, 2.6, 9))); setHp(hp7, lerp(.22, .24, seg(t, 2.6, 9)));
  $id("d-talk").classList.toggle("hot", t > 1.0 && t < 2.35 && Math.floor(t * 4) % 2 === 0);
  $id("d-tasks").classList.toggle("hot", t > 3.1 && t < 4.3 && Math.floor(t * 4) % 2 === 0);

  const c = STEPS.find(([a, z]) => t >= a && t < z);
  if (c) { const [a, z, num, ti, body] = c, v = win(t, a, z, .2);
    cap.style.opacity = v; cap.style.transform = `translateX(-50%) translateY(${(1 - easeOut(v)) * -24}px)`;
    const [row, b] = cap.children; row.children[0].textContent = num; row.children[1].textContent = ti; b.textContent = body; }
  else cap.style.opacity = 0;

  const pv = win(t, 1.05, 3.0, .3);
  phone.style.opacity = pv > 0 ? 1 : 0; phone.style.transform = `translateX(${(1 - easeOut(pv)) * -700}px)`;
  const typed = "Add CSV export to the report page", nch = Math.floor(seg(t, 1.3, 2.2) * typed.length);
  meMsg.textContent = typed.slice(0, nch) || " "; aiMsg.style.opacity = seg(t, 2.35, 2.5);

  const mv = win(t, 6.35, 8.0, .2), use = lerp(.55, .80, ease(seg(t, 6.45, SLEEP)));
  meter.style.opacity = mv; meter.style.transform = `translateY(${(1 - easeOut(mv)) * 30}px)`;
  const bar = meter.querySelector(".bar i"); bar.style.width = (use * 100).toFixed(1) + "%"; bar.className = use < .7 ? "" : use < .79 ? "mid" : "low";
  meter.querySelector(".pct").textContent = Math.round(use * 100) + "%";
  meter.querySelector("em").textContent = t >= SLEEP ? "PAUSED · NAPPING" : "";

  const gv = win(t, 8.15, 9.2, .2); merged.style.opacity = gv; merged.style.transform = `translateX(-50%) scale(${.8 + .2 * back(seg(t, 8.15, 8.5))})`;

  const tv = 1 - seg(t, 0.75, 1.05), ev = seg(t, 9.15, 9.45);
  veil.style.opacity = Math.max(tv, ev);
  $id("cam").style.filter = Math.max(tv, ev) > .01 ? `blur(${(Math.max(tv, ev) * 5).toFixed(2)}px)` : "none";
  title.style.opacity = tv * seg(t, 0, .25); end.style.opacity = ev;
  title.querySelector("h1").style.transform = `translateY(${(1 - easeOut(seg(t, 0, .6))) * 24}px)`;
  end.style.transform = `scale(${1.04 - .04 * easeOut(ev)})`;
  cardCv.forEach(x => { x.clearRect(0, 0, 32, 36); x.drawImage(skinFrameHD(SKIN.matan, { arms: Math.floor(t / .4) % 2, blink: blinkAt(t, 9), happy: true }), 0, 0); });
};
window.DUR = DUR;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => { render(0); return true; });
render(0);
