<!doctype html>

<title>Escritório Digital</title>
<style>
  :root {
    --bg: #f5f4fa; --surface: #ffffff; --surface2: #f0eef8; --line: #e4e1f0; --fg: #1c1a2b; --dim: #6b6784;
    --acc: #6d4aff; --acc-soft: #ece8ff; --ok: #1f9d63; --ok-soft: #e0f6ea; --bad: #d63b40; --bad-soft: #fde7e8; --warn: #c77700; --warn-soft: #fff1d6;
    --shadow: 0 1px 2px rgba(28, 26, 43, .06), 0 6px 18px rgba(28, 26, 43, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15131f; --surface: #1f1c2d; --surface2: #282439; --line: #34304a; --fg: #f3f1fb; --dim: #a29db9;
      --acc: #8f74ff; --acc-soft: #2c2650; --ok: #3ecf8e; --ok-soft: #143528; --bad: #ff6b70; --bad-soft: #3f1d22; --warn: #f5a524; --warn-soft: #3b2e12;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  body { display: flex; flex-direction: row; border: 1px solid var(--line); overflow: hidden; }
  #left { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; min-height: 0; }
  #reader { display: none; }
  body.wide #left { flex: 0 0 430px; border-right: 1px solid var(--line); }
  body.wide #reader { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; background: var(--bg); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }

  header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; -webkit-app-region: drag; }
  header .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--acc-soft); overflow: hidden; flex: none; position: relative; }
  header .logo canvas { position: absolute; left: -12px; top: -14px; width: 56px; height: 46px; image-rendering: pixelated; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); font-weight: 600; }
  .pill.off { background: var(--bad-soft); color: var(--bad); }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  #help { -webkit-app-region: no-drag; background: var(--surface2); border: 0; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: var(--acc); font-weight: 800; font-size: 14px; margin-right: 4px; }
  #help:hover { background: var(--acc-soft); }
  #close { -webkit-app-region: no-drag; background: none; border: 0; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 18px; line-height: 1; }
  #close:hover { background: var(--surface2); color: var(--fg); }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 4px 14px 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; box-shadow: var(--shadow); }
  .tile b { display: block; font-size: 22px; line-height: 1.1; }
  .tile span { font-size: 11.5px; color: var(--dim); }
  .tile.hot { background: var(--bad-soft); border-color: transparent; } .tile.hot b { color: var(--bad); }

  main { flex: 1; overflow-y: auto; padding: 4px 14px 14px; }
  section { display: none; } section.on { display: block; animation: in .18s ease; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 14px 2px 8px; font-weight: 700; }
  h2:first-child { margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .agent { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .agent:hover { border-color: var(--acc); }
  .avatar { width: 52px; height: 52px; border-radius: 14px; background: var(--acc-soft); position: relative; overflow: hidden; flex: none; }
  .avatar canvas { position: absolute; left: -22px; top: -22px; width: 112px; height: 92px; image-rendering: pixelated; }
  .agent .who { flex: 1; min-width: 0; }
  .agent .name { font-weight: 700; } .agent .role { color: var(--dim); font-weight: 400; }
  .agent .task { color: var(--dim); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip { font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; flex: none; }
  .chip.working { background: var(--ok-soft); color: var(--ok); } .chip.idle { background: var(--warn-soft); color: var(--warn); }
  .chip.alert { background: var(--bad-soft); color: var(--bad); } .chip.offline { background: var(--surface2); color: var(--dim); }
  .detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--dim); white-space: pre-wrap; word-break: break-word; }

  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { display: flex; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .feed li:last-child { border: 0; } .feed time { color: var(--dim); font-size: 12px; flex: none; min-width: 64px; }
  .feed .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  .review h3 { margin: 0 0 2px; font-size: 16px; }
  .review .by { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; }
  .label { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); margin: 10px 0 5px; }
  .said { background: var(--surface2); border-radius: 10px; padding: 9px 11px; font-size: 13px; white-space: pre-wrap; word-break: break-word; max-height: 130px; overflow: auto; }
  .files { list-style: none; margin: 0; padding: 0; background: var(--surface2); border-radius: 10px; }
  .files li { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; }
  .files .tagf { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; flex: none; }
  .tagf.A { background: var(--ok-soft); color: var(--ok); } .tagf.M { background: var(--warn-soft); color: var(--warn); } .tagf.D { background: var(--bad-soft); color: var(--bad); }
  .after { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn { border: 0; border-radius: 11px; padding: 11px 14px; font-weight: 700; cursor: pointer; flex: 1; }
  .btn.ok { background: var(--ok); color: #fff; flex: 2; } .btn.ok:hover { filter: brightness(1.08); }
  .btn.ghost { background: var(--surface2); color: var(--fg); } .btn.ghost:hover { background: var(--line); }
  .btn.danger { background: var(--bad-soft); color: var(--bad); } .btn.danger:hover { filter: brightness(.96); }
  .btn.acc { background: var(--acc); color: #fff; } .btn:disabled { opacity: .5; cursor: default; }
  .confirm { background: var(--bad-soft); border-radius: 11px; padding: 10px; margin-top: 12px; } .confirm p { margin: 0 0 8px; font-weight: 600; color: var(--bad); }
  .confirm .actions { margin-top: 0; }

  .empty { text-align: center; padding: 26px 10px; color: var(--dim); }
  .empty .art { width: 168px; height: 138px; margin: 0 auto 6px; display: block; image-rendering: pixelated; }
  .empty b { display: block; font-size: 16px; color: var(--fg); margin-bottom: 4px; }

  textarea, input[type=text], select { width: 100%; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; font: inherit; }
  textarea { height: 120px; resize: none; } textarea:focus, input:focus, select:focus { border-color: var(--acc); outline: none; box-shadow: 0 0 0 3px var(--acc-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .chips button { background: var(--acc-soft); color: var(--acc); border: 0; border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .chips button:hover { filter: brightness(.96); }
  .note { font-size: 12px; color: var(--dim); margin-top: 8px; }
  .sub { color: var(--dim); margin: -2px 2px 10px; font-size: 13px; }
  .field { margin-bottom: 14px; } .field > label { display: block; font-weight: 600; margin: 0 2px 6px; }
  .seg { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: 0; background: transparent; padding: 8px; border-radius: 9px; cursor: pointer; font-weight: 600; color: var(--dim); }
  .seg button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .switch input { appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--line); position: relative; cursor: pointer; flex: none; transition: .15s; }
  .switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; }
  .switch input:checked { background: var(--acc); } .switch input:checked::after { left: 19px; }
  .keyrow { display: flex; align-items: center; gap: 10px; } .keyrow .pill { flex: none; } .keyrow .btn { flex: none; padding: 8px 12px; }
  .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }

  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 10px; font-weight: 500; }
  .toast { position: fixed; left: 50%; bottom: 74px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 99px; font-weight: 600; font-size: 13px; box-shadow: var(--shadow); z-index: 9; animation: in .2s ease; }
  .toast.err { background: var(--bad); color: #fff; }

  nav { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); }
  nav button { background: none; border: 0; padding: 9px 4px 8px; cursor: pointer; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; position: relative; }
  nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on { color: var(--acc); } nav button:hover { color: var(--fg); } nav button.on:hover { color: var(--acc); }
  nav .badge { position: absolute; top: 4px; left: 50%; margin-left: 7px; background: var(--bad); color: #fff; border-radius: 99px; font-size: 10.5px; min-width: 17px; height: 17px; display: grid; place-items: center; padding: 0 4px; }
  .badge-chief { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: #f5c542; color: #4a3600; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
  .badge-lead { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; background: #dbe5fb; color: #2c4a8a; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
  .card.nested { margin-left: 22px; border-left: 3px solid var(--acc-soft); }
  .chat { background: var(--surface2); border-radius: 14px; padding: 10px; height: calc(100vh - 372px); min-height: 190px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .bubble { max-width: 86%; padding: 8px 12px; border-radius: 14px; font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .bubble.me { align-self: flex-end; background: var(--acc); color: #fff; border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .bubble.them.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
  .bubble .waitrow { margin-top: 6px; font-size: 12px; color: var(--warn); font-weight: 600; }
  .link { background: none; border: 0; color: var(--acc); font-weight: 700; cursor: pointer; padding: 0; }
  .typing { display: flex; gap: 4px; padding: 11px 14px; } .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .chatbar { display: flex; gap: 8px; margin-top: 10px; align-items: flex-end; } .chatin { height: 52px !important; resize: none; }
  .picker { width: 100%; padding: 6px 8px; font-weight: 700; border-radius: 9px; }
  .strip { display: none; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; }
  .chipw { display: inline-flex; align-items: center; gap: 5px; background: var(--ok-soft); color: var(--ok); border-radius: 99px; padding: 3px 9px; font-size: 12px; font-weight: 600; }
  .chipw i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; animation: blink 1.2s infinite; }
  .fileli { align-items: center; } .fileli .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .viewer { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin: 8px 0; }
  .vhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .doc { font-size: 13px; line-height: 1.5; max-height: 320px; overflow: auto; }
  .doc .dh { font-weight: 800; margin: 8px 0 3px; } .doc .dh1 { font-size: 15px; } .doc .dh2 { font-size: 14px; } .doc .dh3 { font-size: 13px; color: var(--dim); }
  .doc .sp { height: 6px; } .doc .li { padding-left: 4px; } .doc .p { margin: 2px 0; }
  .doc .tr { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px dashed var(--line); font-size: 12.5px; } .doc .tr span { flex: 1; min-width: 0; word-break: break-word; }
  .mark { background: var(--warn-soft); color: var(--warn); font-weight: 800; font-size: 11px; padding: 0 6px; border-radius: 5px; letter-spacing: .03em; }
  .mark.fill { background: var(--acc-soft); color: var(--acc); letter-spacing: 0; }
  .plan { background: var(--acc-soft); border-radius: 12px; padding: 10px 12px; margin-top: 8px; } .plan b { font-size: 13px; }
  .plan ol { margin: 6px 0 0; padding-left: 18px; } .plan li { margin: 4px 0; font-size: 13px; } .plan .pw { display: block; font-weight: 700; color: var(--acc); font-size: 12px; }
  .plan .ask { font-weight: 700; margin-top: 8px; font-size: 13px; }
  .modal { position: fixed; inset: 0; background: rgba(15, 12, 30, .55); display: grid; place-items: center; z-index: 20; padding: 14px; animation: in .15s ease; }
  .sheet { background: var(--bg); border-radius: 18px; padding: 16px; width: 100%; max-height: 92vh; overflow: auto; box-shadow: var(--shadow); }
  .sheet h3 { margin: 6px 0 4px; font-size: 17px; } .sheet p { margin: 0 0 12px; font-size: 13.5px; color: var(--dim); }
  .srow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; background: var(--acc-soft); border-radius: 14px; padding: 8px 4px 2px; margin-bottom: 10px; }
  .sitem { display: flex; flex-direction: column; align-items: center; width: 92px; text-align: center; font-size: 11px; color: var(--dim); } .sitem canvas { width: 84px; height: 69px; image-rendering: pixelated; }
  .mini { background: var(--acc-soft); border-radius: 14px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0 10px; } .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--acc); width: 18px; border-radius: 99px; }
  .connrow { padding: 9px 0; border-bottom: 1px solid var(--line); } .connrow:last-child { border: 0; }
  .connrow .cn { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
  .how { margin-top: 10px; font-size: 13px; } .how summary { cursor: pointer; font-weight: 700; color: var(--acc); }
  .steps { margin: 8px 0 0; padding-left: 20px; color: var(--dim); } .steps li { margin: 5px 0; }
  nav .badge.info { background: var(--acc); }
  .notices { padding: 0 14px; } .notices:empty { display: none; } .notices .banner { margin: 0 0 8px; } .banner.upd { background: var(--acc-soft); color: var(--fg); } .banner.alert { background: var(--bad-soft, #3a1d22); color: var(--bad, #ff8a8f); }
  .banner .actions { display: flex; gap: 6px; flex-wrap: wrap; } .banner .actions .btn { flex: none; padding: 6px 12px; font-size: 12.5px; }
  select.exp { width: auto; max-width: 150px; padding: 6px 8px; font-size: 12.5px; border-radius: 9px; cursor: pointer; }
  .fmts { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 2px; }
  pre.cmd { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-family: Consolas, "SF Mono", monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-all; user-select: all; }
  .sheet.legal { max-width: 440px; } .legal-list { margin: 8px 0 12px; padding-left: 18px; font-size: 13px; line-height: 1.5; } .legal-list li { margin-bottom: 8px; }
  details.how.card summary { font-weight: 700; }
  .prop .propitem { border-top: 1px solid var(--line); padding: 10px 0; } .prop .propitem:first-of-type { border-top: 0; }
  .prop .detail { white-space: pre-wrap; max-height: 220px; overflow: auto; font-size: 12.5px; margin-top: 6px; }
  .note.warn { color: var(--warn); font-weight: 600; }
  .prop .propitem label.switch { align-items: flex-start; } .prop .pname { flex: 1; min-width: 0; line-height: 1.35; } .prop .pname .badge-lead { margin-left: 6px; white-space: nowrap; }
  .banner.pace { background: var(--warn-soft); color: var(--warn); } .banner.pace b { display: block; margin-bottom: 3px; }
  .jobhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; } .jt { min-width: 0; } .jt b { display: block; }
  .card.recent { opacity: .85; }
  .tree { list-style: none; margin: 10px 0 4px; padding: 0; }
  .tree li { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; } .tree .tn { font-weight: 600; } .tree .tt { margin-left: auto; white-space: nowrap; }
  .sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: none; }
  .sdot.running { background: var(--ok); animation: blink 1.2s infinite; } .sdot.waiting { background: var(--warn); } .sdot.queued { background: var(--line); } .sdot.done { background: var(--ok); } .sdot.failed { background: var(--bad); }
  .steps2 { list-style: none; margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--line); }
  .steps2 li { display: flex; gap: 8px; padding: 5px 0; font-size: 13px; align-items: flex-start; } .steps2 .si { flex: none; width: 20px; text-align: center; }
  .steps2 .sx { flex: 1; min-width: 0; word-break: break-word; } .steps2 time { color: var(--dim); font-size: 11.5px; white-space: nowrap; flex: none; }
  .raw { font-family: Consolas, monospace; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .rd-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  .rd-head > * { -webkit-app-region: no-drag; } .rd-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; } .rd-title b { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rd-seg { width: 190px; } .rd-x { background: none; border: 0; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 20px; } .rd-x:hover { background: var(--surface2); color: var(--fg); }
  .rd-body { flex: 1; overflow: auto; padding: 18px 22px; min-height: 0; }
  .paper { max-width: 760px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 26px 32px; box-shadow: var(--shadow); font-size: 15px; line-height: 1.65; }
  .paper .doc { max-height: none; font-size: 15px; line-height: 1.65; } .paper .doc .dh1 { font-size: 20px; } .paper .doc .dh2 { font-size: 17px; } .paper .doc .p { margin: 6px 0; }
  .editor { width: 100%; min-height: 360px; height: calc(100% - 64px); resize: none; border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px; font: 15px/1.65 "Segoe UI", system-ui, sans-serif; background: var(--surface); color: var(--fg); }
  .editor:focus { outline: none; border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-soft); }
  .rd-foot { border-top: 1px solid var(--line); padding: 10px 16px 12px; background: var(--surface); }
  .thread { max-height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
  .diff { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; font-size: 14px; line-height: 1.55; margin: 10px 0; }
  .dl { padding: 2px 14px; white-space: pre-wrap; word-break: break-word; } .dl.add { background: var(--ok-soft); } .dl.del { background: var(--bad-soft); text-decoration: line-through; opacity: .85; }
  .dl .sign { display: inline-block; width: 16px; font-weight: 800; } .dl.skip { color: var(--dim); font-size: 12px; text-align: center; padding: 4px; }
