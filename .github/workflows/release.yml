# A release is one tag. Push a tag like v1.1.0 (it must match the VERSION file) and this workflow runs the tests, builds the
# image for Windows/Linux (amd64) and Apple-silicon Macs (arm64), publishes it as ghcr.io/lcssurf/escritorio-digital:<version>
# (and :latest) and opens the GitHub release with the notes from CHANGELOG.md. The app and `escritorio.mjs atualizar` look for it.
name: Lançamento

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  testes:
    uses: ./.github/workflows/ci.yml

  publicar:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A etiqueta bate com o arquivo VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${v}" ]; then echo "A etiqueta ${GITHUB_REF_NAME} não bate com VERSION (${v})"; exit 1; fi
          echo "VERSION=${v}" >> "$GITHUB_ENV"
      - name: Notas desta versão (CHANGELOG.md)
        run: |
          awk -v v="${VERSION}" '$0 ~ "^## " v "( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "CHANGELOG.md não tem a seção ## ${VERSION}"; exit 1; fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Montar e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/lcssurf/escritorio-digital:${{ env.VERSION }}
            ghcr.io/lcssurf/escritorio-digital:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Abrir a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "Escritório Digital ${VERSION}" --notes-file notes.md --verify-tag
