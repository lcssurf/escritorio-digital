<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Escritório Digital</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; }
  .pet { position: absolute; bottom: 0; cursor: pointer; transition: transform .12s ease; will-change: left; }
  .pet canvas { display: block; image-rendering: pixelated; width: 168px; height: 138px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
  .pet:hover { transform: translateY(-3px); }
  /* who is who at a glance: the team's colour under the feet and on a name plate; the chief and the coordinators a little bigger */
  .pet .ring { position: absolute; left: 50%; bottom: -2px; width: 78px; height: 11px; transform: translateX(-50%); border-radius: 50%; pointer-events: none; z-index: -1;
               background: radial-gradient(ellipse at center, color-mix(in srgb, var(--team, #4a5568) 85%, transparent) 0 52%, transparent 74%); }
  .pet .pill { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); max-width: 112px; padding: 0 8px; border-radius: 9px; font: 700 11px/15px "Segoe UI", system-ui, sans-serif; color: #fff;
               background: var(--team, #4a5568); box-shadow: 0 1px 0 rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,255,255,.28); text-shadow: 0 1px 0 rgba(0,0,0,.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
  .pet.animal .pill { top: -4px; }   /* the animals sit taller than they walk: the plate stays clear of the head either way */
  .pet.alert .pill, .pet.saying .pill { display: none; }
  .pet.chief canvas { transform: scale(1.14); transform-origin: 50% 100%; } .pet.lead canvas { transform: scale(1.07); transform-origin: 50% 100%; }
  .pet:hover canvas { filter: drop-shadow(0 0 3px rgba(255,255,255,.95)) drop-shadow(0 2px 0 rgba(0,0,0,.2)); }
  .pet.dragging { cursor: grabbing; transform: translateY(-6px); }
  .pet.pop { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
  .pet.leave { animation: leave .45s ease forwards; pointer-events: none; }
  @keyframes leave { to { opacity: 0; transform: translateY(-30px) scale(.8); } }
  @keyframes pop { from { opacity: 0; transform: translateY(-40px) scale(.7); } to { opacity: 1; transform: none; } }
  .pet .tag { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 2px; min-width: 120px; max-width: 250px;
              background: rgba(24, 22, 34, .94); color: #fff; padding: 6px 10px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.35);
              border: 1px solid rgba(255,255,255,.12); display: none; pointer-events: none; text-align: left; }
  .pet .tag::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -5px; border: 5px solid transparent; border-top-color: rgba(24,22,34,.94); }
  .pet:hover .tag, .pet.dragging .tag { display: block; }
  .tag .l1 { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tag .l2 { font-size: 11.5px; opacity: .78; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pet .say { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 4px; width: 230px; display: none; pointer-events: none;
              background: #fff; color: #1c1a2b; padding: 8px 12px; border-radius: 14px; font-size: 13px; line-height: 1.35; box-shadow: 0 6px 18px rgba(0,0,0,.35); border: 1px solid #d9d6e8; }
  .pet .say::after { content: ""; position: absolute; left: 50%; top: 100%; margin-left: -6px; border: 6px solid transparent; border-top-color: #fff; }
  .pet.saying .say { display: block; animation: sayin .3s ease; }
  @keyframes sayin { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%); } }
  .pet.saying .tag { display: none !important; }
  .pet.alert .tag { display: block; background: #e5484d; border-color: #ff9b9e; }
  .pet.alert .tag::after { border-top-color: #e5484d; }
  .pet.alert:hover .tag { background: #cf3a3f; }
  .pet.alert { animation: nudge 2.4s ease-in-out infinite; }
  @keyframes nudge { 0%, 88%, 100% { transform: translateY(0); } 92% { transform: translateY(-5px); } 96% { transform: translateY(0); } }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: #868e96; vertical-align: 0; }
  .dot.working { background: #30a46c; } .dot.alert { background: #fff; } .dot.idle { background: #f5a524; } .dot.offline { background: #868e96; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../i18n/index.js"></script>
<script src="sprites.js"></script><script src="animals.js"></script>
<script src="office.js"></script>
<script src="app.js"></script>
</body>
</html>
