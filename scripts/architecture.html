<!doctype html>
<!-- The README's architecture picture, drawn with the farm UI's own HD sprites and layout. Render it:
     scripts/render-architecture.sh  (headless Chrome -> assets/architecture.png) -->
<html lang="en"><head><meta charset="utf-8"><title>clodfarm architecture</title>
<link rel="stylesheet" href="../clodfarm/ui/style.css">
<style>
  html, body { overflow: visible; height: auto; }
  body { margin: 0; width: 1980px; height: 944px; background: #1c3519; position: relative; }
  #c { position: absolute; left: 300px; top: 0; width: 1680px; height: 944px; image-rendering: pixelated; }
  #ov { position: absolute; inset: 0; }
  #wires { position: absolute; inset: 0; pointer-events: none; }
  .note { position: absolute; padding: 10px 14px 12px; max-width: 330px; font: 20px/1.1 var(--font-body); }
  .note h4 { font: 11px/1.5 var(--font-px); margin: 0 0 6px; color: var(--clay-2); letter-spacing: .5px; font-weight: 400; }
  .note code { font: 19px var(--font-body); color: var(--ink-2); background: #fff; padding: 0 4px; border-radius: 3px; }
  .note .hp { margin-top: 6px; }
  .note .hp .lbl { min-width: 70px; }
  .title { position: absolute; left: 1140px; top: 22px; transform: translateX(-50%); display: flex; padding: 5px; background: var(--paper);
    border: 4px solid var(--ink); border-radius: 4px; box-shadow: 0 4px 0 var(--shadow); }
  .title span { font: 14px/1 var(--font-px); padding: 11px 14px; }
  .title span:first-child { color: #fff; background: var(--sky); }
  .title span:last-child { background: var(--sky-2); border: 2px solid var(--sky); border-left: 0; }
  .col { position: absolute; left: 0; top: 0; width: 300px; height: 944px; background: #28501f; box-shadow: inset -6px 0 0 #1c3519; }
  .col h3 { position: absolute; left: 34px; top: 190px; font: 12px/1.6 var(--font-px); color: #ffd59e; text-shadow: 2px 2px 0 #1b2410; }
  .rc { position: absolute; font: 10px var(--font-px); color: #fff; background: rgba(22,30,12,.8); padding: 6px 8px; border-radius: 4px; }
  .phone { position: absolute; width: 250px; height: 430px; background: #1c2233; border: 5px solid #0e121c; border-radius: 30px;
    box-shadow: 0 6px 0 rgba(18,22,12,.35); padding: 34px 12px 14px; }
  .phone .scr { background: var(--paper); border-radius: 10px; height: 100%; padding: 12px 10px; display: flex; flex-direction: column; gap: 9px; }
  .phone .app { font: 9px/1.4 var(--font-px); color: var(--clay-2); }
  .msg { font: 19px/1.05 var(--font-body); padding: 7px 9px; border: 3px solid var(--ink); border-radius: 8px; background: #fff; max-width: 90%; }
  .msg.me { align-self: flex-end; background: #fde6df; }
  .tagname { position: absolute; font: 10px var(--font-px); color: #fff; transform: translateX(-50%); white-space: nowrap;
    text-shadow: 2px 2px 0 #1b2410, -1px 1px 0 #1b2410, 1px -1px 0 #1b2410, -1px -1px 0 #1b2410; }
  .tagname.mine { color: #ffd59e; }
  .bubble { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); }
  .bubble.ok { background: #e3f6e6; } .bubble.ok::after { background: #e3f6e6; }
</style></head>
<body data-page="diagram">
<canvas id="c"></canvas>
<svg id="wires" viewBox="0 0 1980 944"></svg>
<div id="ov"></div>
<script src="../clodfarm/ui/app.js"></script>
<script>
"use strict";
const S = 4, OX = 300, cv = document.getElementById("c"), ov = document.getElementById("ov");
// the real farm's layout (layoutFarm) at 4 px per world pixel: barn, yard and pond on the left, the fenced field on the right
const L = layoutFarm({ plots: 6, yard: 5 }, { w: 1680, h: 944, S, top: 0, bottom: 0, left: 0, right: 0, snap: (z) => z });
const W = L.W, H = L.H, world = buildWorld(L, 7);
cv.width = W * S; cv.height = H * S;
const g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
g.setTransform(S, 0, 0, S, 0, 0);
g.drawImage(world.bg, 0, 0, W, H);
const colMatan = HAT_COLORS[1], colGil = HAT_COLORS[2], colNoa = HAT_COLORS[4];
const skin = { matan: skinOf("straw", null, "", colMatan), gil: skinOf("beanie", null, "", colGil), noa: skinOf("cap", null, "", colNoa) };
const P = L.plots, spot = (p) => ({ x: p.x - 7, y: p.y + p.h }), sub = (p, n) => ({ x: p.x + SUB_SPOTS[n][0], y: p.y + SUB_SPOTS[n][1] });
// crops: the field shows the work (growing where sub-agents run, Claude's spark where work landed)
drawCrops(g, P[0], "grow", 0.3, false); drawCrops(g, P[1], "grow", 1.1, false); drawCrops(g, P[4], "ripe", 0, true); drawCrops(g, P[5], "ripe", 0.7, true);
// the schedule board by the barn (as the farm draws it)
const b = L.board;
g.fillStyle = "rgba(20,32,10,.35)"; g.fillRect(b.x + 1, b.y + b.h + 5, b.w, 3);
g.fillStyle = "#4a3120"; g.fillRect(b.x + 2, b.y + 4, 2, b.h + 4); g.fillRect(b.x + b.w - 4, b.y + 4, 2, b.h + 4);
g.fillStyle = "#3a2616"; g.fillRect(b.x, b.y, b.w, b.h - 2); g.fillStyle = "#8a6038"; g.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 4);
g.fillStyle = "#a37446"; g.fillRect(b.x + 1, b.y + 1, b.w - 2, 1);
for (let i = 0; i < 5; i++) { const nx = b.x + 3 + (i % 3) * 7, ny = b.y + 3 + Math.floor(i / 3) * 7;
  g.fillStyle = i % 2 ? "#fff4c2" : "#f6f1e4"; g.fillRect(nx, ny, 5, 5); g.fillStyle = "#b9ad90"; g.fillRect(nx + 1, ny + 2, 3, 1); g.fillStyle = "#c0392b"; g.fillRect(nx + 2, ny, 1, 1); }
// the planner's scarecrow in its corner of the field
const cr = L.crow, sh8 = shadowSprite(8, 2), shC = shadowSprite(7, 2), shM = shadowSprite(4, 1);
g.globalAlpha = 0.35; g.drawImage(sh8, cr.x - sh8.width / 4, cr.y - sh8.height / 4, sh8.width / 2, sh8.height / 2); g.globalAlpha = 1;
g.drawImage(SCARECROW_HD[0], cr.x - 8, cr.y - 21.5, 16, 22);
// the Claudes: matan with its sub-agents (one runs on gil's account), gil with its own, noa napping in the yard
const claude = (sk, at, pose, laptop) => {
  g.globalAlpha = 0.35; g.drawImage(shC, at.x - shC.width / 4, at.y - shC.height / 4, shC.width / 2, shC.height / 2); g.globalAlpha = 1;
  g.drawImage(skinFrameHD(sk, pose), at.x - 8, at.y - 17, 16, 18);
  if (laptop) g.drawImage(LAPTOP_HD[0], at.x + 4, at.y - 6, 9, 7);
};
const mini = (c, at) => {
  g.globalAlpha = 0.35; g.drawImage(shM, at.x - shM.width / 4, at.y - shM.height / 4, shM.width / 2, shM.height / 2); g.globalAlpha = 1;
  g.drawImage(miniHD(c, { arms: 1 }), at.x - 5, at.y - 8, 10, 8);
  g.fillStyle = "#1b1f2a"; g.fillRect(at.x + 3, at.y - 4, 4.5, 3); g.fillStyle = "#7cfc9a"; g.fillRect(at.x + 3.5, at.y - 3.5, 3.5, 1);
  g.fillStyle = "#d97757"; g.fillRect(at.x + 3.5, at.y - 2.5, 2, 0.5); g.fillStyle = "#9aa3b2"; g.fillRect(at.x + 2.5, at.y - 1, 5.5, 1);
};
const matan = spot(P[0]), gil = spot(P[1]), noa = yardSpot(L, 1);
const minisM = [[sub(P[0], 0), colMatan], [sub(P[0], 1), colGil], [sub(P[0], 3), colMatan]];
[[minisM[0][0].y, () => mini(minisM[0][1], minisM[0][0])], [minisM[1][0].y, () => mini(minisM[1][1], minisM[1][0])], [sub(P[1], 0).y, () => mini(colGil, sub(P[1], 0))],
  [matan.y, () => claude(skin.matan, matan, { look: 1, arms: 2 }, true)], [gil.y, () => claude(skin.gil, gil, { look: 1, arms: 3 }, true)],
  [minisM[2][0].y, () => mini(minisM[2][1], minisM[2][0])], [noa.y, () => claude(skin.noa, noa, { sleep: true }, false)]]
  .sort((a, c) => a[0] - c[0]).forEach(([, f]) => f());
g.drawImage(ARROW_MINE, matan.x - 2.25, matan.y - 26, 4.5, 3.5);
g.drawImage(ZED, noa.x + 6, noa.y - 16, 3, 3); g.drawImage(ZED, noa.x + 9, noa.y - 20.5, 3.5, 3.5); g.drawImage(ZED, noa.x + 13, noa.y - 25.5, 4, 4);
g.drawImage(world.fg, 0, world.fgY, W, H - world.fgY);

// ------------------------------------------------------------ overlays (world px * S)
const at = (x, y) => ({ left: OX + x * S + "px", top: y * S + "px" });
const el = (tag, cls, style, html) => { const e = document.createElement(tag); if (cls) e.className = cls; Object.assign(e.style, style); if (html != null) e.innerHTML = html; ov.append(e); return e; };
const bubble = (name, x, y, text, cls = "") => el("div", "bubble " + cls, at(x, y), (name ? `<img src="${icon(name)}" alt="">` : "") + (text ? `<span>${text}</span>` : ""));
const hp = (label, used) => `<div class="hp"><span>${label}</span><div class="bar"><i class="${used < .5 ? "" : used < .8 ? "mid" : "low"}" style="width:${used * 100}%"></i></div><span class="lbl">${Math.round(used * 100)}% USED</span></div>`;
const tag = (name, x, y, cls = "") => el("div", "tagname " + cls, at(x, y + 3), name);
tag("MATAN", matan.x, matan.y, "mine"); tag("GIL", gil.x, gil.y); tag("NOA", noa.x, noa.y);
bubble("terminal", matan.x, matan.y - 25, "3 SUB-AGENTS"); bubble("terminal", gil.x, gil.y - 25, "1 SUB-AGENT"); 
bubble("plan", cr.x, cr.y - 24, "PLANNER", "crow");

el("div", "goal title", {}, `<span class="goal-label">HOW</span><span class="goal-text">CLODFARM WORKS</span>`);

el("div", "col", {}, "<h3>YOU, ON<br>YOUR PHONE</h3>");
el("div", "phone", { left: "25px", top: "250px" }, `<div class="scr">
  <div class="app">CLAUDE APP → CODE → [CLODFARM] MATAN</div>
  <div class="msg me">refactor the importer, and have gil's Claude take the batching part</div>
  <div class="msg">On it: 3 sub-agents. Batching runs on gil's account; I've used 35% of my 5 hours.</div>
  <div class="msg me">every weekday at 9, triage new issues</div>
  <div class="msg">Scheduled (Asia/Jerusalem).</div></div>`);

const n1 = el("div", "note panel", { left: "322px", top: "170px", maxWidth: "290px" },
  `<h4>1 · YOU TALK TO YOUR CLAUDE</h4>From the Claude app, over Remote Control. Each Claude is one person's account: yours, gil's, noa's.`);
const n2 = el("div", "note panel", { left: "1494px", top: "22px", maxWidth: "440px" },
  `<h4>2 · SUB-AGENTS YOU CAN SEE</h4><code>clodfarm spawn</code> starts one: a mini Claude in its own git worktree, working at its Claude's plot. No <code>--on</code>? It runs on whichever Claude has budget free: <b style="color:${colGil}">this one</b> runs on gil's.`);
const n3 = el("div", "note panel", { left: "322px", top: "448px", maxWidth: "290px" },
  `<h4>3 · USAGE, REAL TIME</h4>Every account is paced on its real 5-hour and 7-day usage, live from every run. Noa naps in the yard to keep room for her own Claude.
   ${hp("5H", .81)}${hp("7D", .64)}`);
const n4 = el("div", "note panel", { left: "1694px", top: "396px", maxWidth: "270px" },
  `<h4>4 · CLAUDES WORK TOGETHER</h4><code>clodfarm msg gil "…"</code> lands in gil's next turn. <code>clodfarm agents</code> shows how much usage each has used.`);
const n5 = el("div", "note panel", { left: "322px", top: "742px", maxWidth: "500px" },
  `<h4>5 · THE BARN AND THE BOARD</h4>One store (SQLite, or DynamoDB across boxes) and one git repo. Sub-agents land on main when your tests pass. The board runs schedules: <code>--cron</code>, <code>--every</code>, <code>--at</code>.`);

// wires: dashed pixel lines from each note to what it explains
const wires = document.getElementById("wires");
const path = (pts) => { const [x2, y2] = pts[pts.length - 1]; wires.insertAdjacentHTML("beforeend", `<path d="M${pts.map(p => p.join(" ")).join(" L")}" stroke="#1f2a44" stroke-width="4" stroke-dasharray="8 6" fill="none"/><rect x="${x2 - 6}" y="${y2 - 6}" width="12" height="12" fill="#f4f1e8" stroke="#1f2a44" stroke-width="3"/>`); };
const line = (x1, y1, x2, y2) => path([[x1, y1], [x2, y2]]);
const S2 = (x, y) => [OX + x * S, y * S];
const box = (e) => e.getBoundingClientRect();
path([[275, 440], [S2(matan.x - 18, 0)[0], 440], S2(matan.x - 11, matan.y - 7)]); // along the dirt path to the field
el("div", "rc", { left: "300px", top: "400px" }, "REMOTE CONTROL");
line(...S2(matan.x + 30, matan.y + 7), ...S2(gil.x - 11, gil.y - 4));
line(box(n4).left, box(n4).top + 74, ...S2((matan.x + gil.x) / 2 + 9, (matan.y + gil.y) / 2 + 2));
line(box(n2).left, box(n2).bottom - 30, ...S2(minisM[1][0].x + 4, minisM[1][0].y - 9));
line(box(n3).right, box(n3).top + 70, ...S2(noa.x - 10, noa.y - 6));
line(box(n5).right - 60, box(n5).top, ...S2(L.door.x, L.door.y - 6));
line(box(n5).right - 16, box(n5).top + 26, ...S2(L.board.x + L.board.w / 2, L.board.y + L.board.h + 6));
</script>
</body></html>
